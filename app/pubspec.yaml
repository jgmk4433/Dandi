publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.6.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  camera: ^0.11.0+2
  tflite_flutter: ^0.11.0
  image: ^4.2.0
  http: ^1.2.2
  path_provider: ^2.1.4
  shared_preferences: ^2.3.2
  geolocator: ^13.0.1
  geocoding: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/models/